[package]
name = "bilinook"
description = "BiliNook desktop app for Bilibili updates, videos, and live streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "BiliNook"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.12"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
async-channel.workspace = true
futures.workspace = true
lru.workspace = true
open.workspace = true
tokio.workspace = true
url.workspace = true
chrono.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
bili-core = { path = "../bili-core" }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
raw-window-handle = "0.6"
md5.workspace = true
image.workspace = true
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_Media_Audio", "Data_Xml_Dom", "Foundation", "UI_Notifications"] }
windows-registry = "0.6"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
webview2-com = "0.39"

